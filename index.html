<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>업무용 시설/안전 점검 시스템</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Firebase compat (버전 10 호환) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    @keyframes bounce{0%,100%{transform:translateY(-10%);animation-timing-function:cubic-bezier(.8,0,1,1)}50%{transform:none;animation-timing-function:cubic-bezier(0,0,.2,1)}}
    .animate-bounce{animation:bounce 1s infinite}
    @keyframes pulse{50%{opacity:.5}}
    .animate-pulse{animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}
    body { background-color: #f8fafc; }
  </style>
</head>
<body>
  <div id="root"></div>


<script>
  // 1. Firebase 초기화 설정
  const firebaseConfig = {
    apiKey: "AIzaSyAoVGRAKKfCr-IEh7s4HVCc8r5wpeWUv0Q",
    authDomain: "check-calendar-app-2fd92.firebaseapp.com",
    projectId: "check-calendar-app-2fd92",
    storageBucket: "check-calendar-app-2fd92.firebasestorage.app",
    messagingSenderId: "762125584592",
    appId: "1:762125584592:web:ed057de6598f8e9bb476d5",
    measurementId: "G-CK69NSE8TX"
  };
  
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  window.__fbAuth = firebase.auth();
  window.__fbDb = firebase.firestore();
</script>


<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;


const auth = window.__fbAuth;
const db   = window.__fbDb;


const reportsPath = 'reports';
const logsPath = 'dailyLogs';
const userPath = (uid) => `users/${uid}`;


// 대분류
const CATEGORIES = ['경기 중 시설 VOC', '일일 화재점검', '일일 안전 및 시설 점검', '긴급화재안전점검(6/2~6/3)'];
const TRADES = ['전기', '소방', '기계', '건축', '안전'];
const STATUSES = ['조치 예정', '조치 중', '조치 완료'];
const LOG_CATEGORIES = ['일일 시설안전 점검', '일일 화재점검'];


// --- 아이콘 컴포넌트 ---
function Icon({ name, size = 24, className = '' }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      window.lucide.createIcons({ root: ref.current });
    }
  }, [name, size, className]);
  return <span ref={ref} className={`inline-flex items-center justify-center ${className}`}><i data-lucide={name} style={{width: size, height: size}}></i></span>;
}


// --- 공용 모달 컴포넌트 ---
function ConfirmModal({ title, message, onConfirm, onCancel }) {
  return (
    <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[100] p-4">
      <div className="bg-white rounded-3xl w-full max-w-sm shadow-2xl p-8 text-center border border-gray-100">
        <div className="bg-red-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-5">
          <Icon name="trash-2" size={40} className="text-red-500" />
        </div>
        <h3 className="text-xl font-black text-gray-900 mb-3">{title}</h3>
        <p className="text-sm text-gray-500 mb-8 font-bold leading-relaxed break-keep">{message}</p>
        <div className="flex gap-3">
          <button onClick={onCancel} className="flex-1 py-3.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-black rounded-xl">취소</button>
          <button onClick={onConfirm} className="flex-1 py-3.5 bg-red-600 hover:bg-red-700 text-white font-black rounded-xl shadow-md">삭제하기</button>
        </div>
      </div>
    </div>
  );
}


// --- 구글맵 위성지도 뷰어 ---
function GoogleImageMap({ location, onChange }) {
  return (
    <div className="relative w-full h-[400px] bg-[#e5e5e5] rounded-xl overflow-hidden shadow-inner group select-none cursor-crosshair border border-gray-300">
      <iframe src="https://maps.google.com/maps?q=인천+문학경기장&t=k&z=15&output=embed" width="100%" height="100%" frameBorder="0" style={{ border: 0, pointerEvents: 'none' }} allowFullScreen aria-hidden="false" tabIndex="-1"></iframe>
      <div className="absolute inset-0 bg-black/0 hover:bg-black/10 transition-colors z-10" onClick={(e) => {
          if (!onChange) return;
          const rect = e.currentTarget.getBoundingClientRect();
          onChange({ x: ((e.clientX - rect.left) / rect.width) * 100, y: ((e.clientY - rect.top) / rect.height) * 100 });
        }}>
        {location && (
          <span className="absolute -translate-x-1/2 -translate-y-full pointer-events-none" style={{ left: `${location.x}%`, top: `${location.y}%` }}>
            <Icon name="map-pin" size={42} className="text-red-500 drop-shadow-md" />
          </span>
        )}
        {!location && onChange && (
          <div className="absolute top-4 left-4 bg-black/80 text-white text-sm font-bold px-4 py-2.5 rounded-lg shadow-md opacity-0 group-hover:opacity-100 pointer-events-none">
            지도의 원하는 위치를 클릭하여 핀을 꽂아주세요.
          </div>
        )}
      </div>
    </div>
  );
}


function StatusCard({ title, count, color, iconName }) {
  return (
    <div className={`p-5 rounded-2xl border ${color} flex items-center justify-between shadow-sm bg-white bg-opacity-60 transition-transform hover:scale-105`}>
      <div>
        <h3 className="text-sm font-bold opacity-80 mb-1">{title}</h3>
        <p className="text-3xl font-black tracking-tight">{count}<span className="text-base font-bold ml-1">건</span></p>
      </div>
      <div className="p-3 rounded-full bg-white bg-opacity-50 shadow-sm"><Icon name={iconName} size={24} /></div>
    </div>
  );
}


// --- 사용자 등록 컴포넌트 ---
function RegisterForm({ user, setProfile, setView, showToast }) {
  const [name, setName] = useState('');
  const [email, setEmail] = useState('');
  const [loading, setLoading] = useState(false);


  const handleRegister = async (e) => {
    e.preventDefault();
    if (!name.trim() || !email.trim()) { showToast('이름과 이메일을 모두 입력해주세요.'); return; }
    setLoading(true);
    try {
      const userData = { uid: user.uid, name, email, createdAt: Date.now() };
      await db.doc(userPath(user.uid)).set(userData);
      setProfile(userData); setView('dashboard'); showToast('환영합니다!');
    } catch (err) { showToast('가입 중 오류가 발생했습니다.'); }
    finally { setLoading(false); }
  };


  return (
    <div className="min-h-screen flex items-center justify-center p-4">
      <div className="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border border-gray-100">
        <div className="flex justify-center mb-6"><div className="bg-blue-50 p-5 rounded-full"><Icon name="file-warning" size={48} className="text-blue-600" /></div></div>
        <h2 className="text-2xl font-black text-center mb-3 text-slate-800">시설/안전 점검 시스템</h2>
        <p className="text-gray-500 text-center mb-8 text-sm font-bold bg-gray-100 py-2 rounded-lg">업무 기록을 위해 프로필 설정이 필요합니다.</p>
        <form onSubmit={handleRegister} className="flex flex-col gap-5">
          <div>
            <label className="block text-sm font-bold text-gray-700 mb-2">이름 (점검자명) *</label>
            <input type="text" required className="w-full p-3.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 bg-gray-50 font-bold" value={name} onChange={e => setName(e.target.value)} placeholder="홍길동" />
          </div>
          <div>
            <label className="block text-sm font-bold text-gray-700 mb-2">업무용 이메일 *</label>
            <input type="email" required className="w-full p-3.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 bg-gray-50 font-bold" value={email} onChange={e => setEmail(e.target.value)} placeholder="work@company.com" />
          </div>
          <button type="submit" disabled={loading} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl mt-4 shadow-md">{loading ? '등록 중...' : '시스템 시작하기'}</button>
        </form>
      </div>
    </div>
  );
}


// --- 엑셀로 내보내기 탭 (이미지 포함 버전으로 수정됨) ---
function ExcelExportView({ reports }) {
  const getStartOfMonth = () => {
    const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1).toISOString().split('T')[0];
  };
  const getToday = () => new Date().toISOString().split('T')[0];


  const [startDate, setStartDate] = useState(getStartOfMonth());
  const [endDate, setEndDate] = useState(getToday());


  const handleExport = () => {
    const filtered = reports.filter(r => r.date >= startDate && r.date <= endDate);
    if (filtered.length === 0) {
      alert('해당 기간에 등록된 시설안전관리 점검 데이터가 없습니다.');
      return;
    }


    // HTML 테이블 문자열 생성 (엑셀에서 이미지를 읽을 수 있는 포맷)
    let tableHtml = `
      <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
      <head>
        <meta charset="utf-8" />
        <style>
          table { border-collapse: collapse; width: 100%; }
          th, td { border: 1px solid #dddddd; text-align: left; padding: 8px; vertical-align: middle; }
          th { background-color: #f2f2f2; font-weight: bold; }
        </style>
      </head>
      <body>
        <table>
          <thead>
            <tr>
              <th>점검일자</th>
              <th>대분류</th>
              <th>공종</th>
              <th>점검자</th>
              <th>상태</th>
              <th>긴급여부</th>
              <th>상세위치</th>
              <th>사진설명</th>
              <th>비고</th>
              <th>현장사진</th>
            </tr>
          </thead>
          <tbody>
    `;


    filtered.forEach(r => {
      tableHtml += `
        <tr>
          <td>${r.date || ''}</td>
          <td>${r.category || ''}</td>
          <td>${r.trade || ''}</td>
          <td>${r.inspectorName || ''}</td>
          <td>${r.status || ''}</td>
          <td>${r.isEmergency ? '긴급' : '일반'}</td>
          <td>${r.locationDesc || ''}</td>
          <td>${r.photoDesc || ''}</td>
          <td>${r.remarks || ''}</td>
          <td style="text-align: center; width: 200px; height: 200px;">
            ${r.photoBase64 ? `<img src="${r.photoBase64}" width="180" height="180" style="object-fit: contain;" />` : '사진 없음'}
          </td>
        </tr>
      `;
    });


    tableHtml += `
          </tbody>
        </table>
      </body>
      </html>
    `;


    // 엑셀(xls) 형식의 Blob 생성 및 다운로드
    const blob = new Blob([tableHtml], { type: 'application/vnd.ms-excel' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    // 확장자를 xls로 설정해야 테이블 내 이미지가 인식됩니다.
    link.download = `시설안전관리_점검내역_${startDate}~${endDate}.xls`;
    link.style.display = "none";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };


  return (
    <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 md:p-10 w-full max-w-4xl mx-auto mt-6 animate-in fade-in duration-300">
      <div className="flex items-center gap-3 mb-8 border-b pb-6">
        <div className="bg-green-100 p-4 rounded-full"><Icon name="download" size={32} className="text-green-600"/></div>
        <div>
          <h2 className="text-2xl font-black text-gray-900">엑셀로 내보내기 (사진 포함)</h2>
          <p className="text-gray-500 font-bold mt-1">원하는 기간을 설정하여 점검 데이터를 다운로드하세요.</p>
        </div>
      </div>


      <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
        <div>
          <label className="block text-sm font-bold text-gray-700 mb-2">시작일</label>
          <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className="w-full p-4 border border-gray-300 rounded-xl bg-gray-50 font-bold text-gray-800 focus:ring-2 focus:ring-green-500" />
        </div>
        <div>
          <label className="block text-sm font-bold text-gray-700 mb-2">종료일</label>
          <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} className="w-full p-4 border border-gray-300 rounded-xl bg-gray-50 font-bold text-gray-800 focus:ring-2 focus:ring-green-500" />
        </div>
      </div>


      <div className="flex gap-3 mb-8">
        <button onClick={() => {
          const d = new Date(); const day = d.getDay(); const diff = d.getDate() - day + (day === 0 ? -6 : 1);
          setStartDate(new Date(d.setDate(diff)).toISOString().split('T')[0]);
          setEndDate(getToday());
        }} className="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm font-bold text-gray-700 transition-colors">이번 주</button>
        <button onClick={() => { setStartDate(getStartOfMonth()); setEndDate(getToday()); }} className="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm font-bold text-gray-700 transition-colors">이번 달</button>
      </div>


      <button onClick={handleExport} className="w-full bg-green-600 hover:bg-green-700 text-white font-black py-5 rounded-xl shadow-md transition-all active:scale-95 flex items-center justify-center gap-2 text-lg">
        <Icon name="download" size={24}/> 설정한 기간 엑셀 다운로드 (사진 포함)
      </button>
    </div>
  );
}


// --- 일일 점검일지 (캘린더) 컴포넌트 ---
function CalendarView({ logs, userProfile, showToast }) {
  const [currentDate, setCurrentDate] = useState(new Date());
  const [isModalOpen, setIsModalOpen] = useState(false);
  const [selectedDateStr, setSelectedDateStr] = useState('');
  const [category, setCategory] = useState(LOG_CATEGORIES[0]);
  const [location, setLocation] = useState('');
  const [inspectorName, setInspectorName] = useState(userProfile.name);
  const [isSubmitting, setIsSubmitting] = useState(false);
  const [formError, setFormError] = useState('');
  const [deleteTargetId, setDeleteTargetId] = useState(null);


  const year = currentDate.getFullYear(); const month = currentDate.getMonth();
  const fmt = (y, m, d) => `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const todayStr = fmt(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());


  const cells = [];
  for (let i = 0; i < new Date(year, month, 1).getDay(); i++) cells.push(null);
  for (let i = 1; i <= new Date(year, month+1, 0).getDate(); i++) cells.push(i);


  const handleDayClick = (day) => {
    if (!day) return;
    setSelectedDateStr(fmt(year, month, day));
    setCategory(LOG_CATEGORIES[0]); setLocation(''); setInspectorName(userProfile.name); setFormError('');
    setIsModalOpen(true);
  };


  const handleSaveLog = async () => {
    if (!location.trim() || !inspectorName.trim()) { setFormError('위치와 점검자를 입력해주세요.'); return; }
    setIsSubmitting(true);
    try {
      await db.collection(logsPath).add({ date: selectedDateStr, category, location, inspectorName, inspectorUid: userProfile.uid, createdAt: Date.now() });
      showToast('저장되었습니다.'); setIsModalOpen(false);
    } catch { setFormError('저장 중 오류 발생'); }
    finally { setIsSubmitting(false); }
  };


  const deleteLog = async () => {
    try { await db.collection(logsPath).doc(deleteTargetId).delete(); showToast('삭제되었습니다.'); } catch { showToast('삭제 오류'); }
    setDeleteTargetId(null);
  };


  return (
    <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-4 md:p-8 w-full animate-in fade-in duration-300">
      <div className="flex items-center justify-between mb-6">
        <div className="flex items-center gap-4">
          <button onClick={() => setCurrentDate(new Date(year, month-1, 1))} className="p-2 hover:bg-gray-100 rounded-full border shadow-sm"><Icon name="chevron-left" /></button>
          <h2 className="text-xl md:text-3xl font-black text-slate-800">{year}년 {month+1}월</h2>
          <button onClick={() => setCurrentDate(new Date(year, month+1, 1))} className="p-2 hover:bg-gray-100 rounded-full border shadow-sm"><Icon name="chevron-right" /></button>
        </div>
        <button onClick={() => setCurrentDate(new Date())} className="px-4 py-2.5 bg-slate-100 font-bold rounded-xl text-sm whitespace-nowrap shrink-0">오늘로 이동</button>
      </div>


      <div className="grid grid-cols-7 gap-px bg-gray-200 border rounded-t-xl overflow-hidden">
        {['일','월','화','수','목','금','토'].map((d,i) => <div key={d} className={`bg-slate-50 py-3 text-center text-base font-black ${i===0?'text-red-600':i===6?'text-blue-600':'text-slate-700'}`}>{d}</div>)}
      </div>


      <div className="grid grid-cols-7 gap-px bg-gray-200 border-x border-b rounded-b-xl min-h-[700px] w-full">
        {cells.map((day, idx) => {
          if (!day) return <div key={`e-${idx}`} className="bg-white/50 min-h-[160px]" />;
          const dateStr = fmt(year, month, day); const isToday = dateStr === todayStr;
          const dayLogs = logs.filter(l => l.date === dateStr);
          return (
            <div key={`d-${day}`} onClick={() => handleDayClick(day)}
              className={`bg-white cursor-pointer flex flex-col group relative overflow-hidden ${isToday ? 'min-h-[160px] md:min-h-[220px] border-[3px] border-blue-500 shadow-xl z-10 p-2 md:p-3 ring-4 ring-blue-100/50 scale-[1.02]' : 'min-h-[160px] p-2 hover:bg-blue-50/50'}`}>
              <div className="flex justify-between items-start mb-2 shrink-0">
                <span className={`text-sm md:text-base font-black flex items-center justify-center rounded-full ${isToday ? 'bg-blue-600 text-white w-8 h-8' : 'w-7 h-7 text-slate-700 group-hover:text-blue-600'}`}>{day}</span>
                <span className="opacity-0 group-hover:opacity-100 text-blue-400 p-0.5"><Icon name="plus" size={16}/></span>
              </div>
              <div className="flex flex-col gap-1.5 flex-1 overflow-y-auto pr-1">
                {dayLogs.map(log => (
                  <div key={log.id} className={`relative group/log px-2 py-2.5 rounded-lg border-l-4 shadow-sm shrink-0 ${log.category==='일일 시설안전 점검'?'bg-slate-50 border-blue-400':'bg-slate-50 border-red-400'}`}>
                    <button onClick={e => { e.stopPropagation(); setDeleteTargetId(log.id); }} className="absolute top-1.5 right-1.5 opacity-0 group-hover/log:opacity-100 bg-red-50 text-red-600 rounded p-1 hover:bg-red-600 hover:text-white z-20"><Icon name="trash-2" size={12}/></button>
                    <div className="flex flex-col gap-0.5 pr-5">
                      <span className="text-[11px] xl:text-xs font-black text-slate-800 leading-tight">{log.category}</span>
                      <span className="text-[10px] xl:text-[11px] font-bold text-slate-600 mt-0.5">-{log.location}</span>
                      <span className="text-[10px] xl:text-[11px] font-bold text-slate-600">-{log.inspectorName}</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        })}
      </div>


      {isModalOpen && (
        <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-3xl w-full max-w-md shadow-2xl overflow-hidden">
            <div className="bg-slate-800 p-5 flex justify-between items-center text-white">
              <h3 className="font-black text-lg flex items-center gap-2"><Icon name="clipboard-list" className="text-blue-400"/> {selectedDateStr} 등록</h3>
              <button onClick={() => setIsModalOpen(false)} className="hover:bg-white/20 p-1.5 rounded-full"><Icon name="x" size={20}/></button>
            </div>
            <div className="p-7 space-y-6">
              {formError && <div className="text-red-600 text-sm font-bold bg-red-50 p-3 rounded-xl border border-red-200 flex items-center gap-2"><Icon name="alert-circle" size={16}/> {formError}</div>}
              <div><label className="block text-sm font-bold mb-2">대분류 *</label><select value={category} onChange={e => setCategory(e.target.value)} className="w-full p-3.5 border rounded-xl bg-gray-50 font-bold">{LOG_CATEGORIES.map(c => <option key={c}>{c}</option>)}</select></div>
              <div><label className="block text-sm font-bold mb-2">점검 위치 *</label><input value={location} onChange={e => setLocation(e.target.value)} className="w-full p-3.5 border rounded-xl bg-gray-50 font-bold" placeholder="예: 북문 출입구" /></div>
              <div><label className="block text-sm font-bold mb-2">점검자 *</label><input value={inspectorName} onChange={e => setInspectorName(e.target.value)} className="w-full p-3.5 border rounded-xl bg-gray-50 font-bold" placeholder="점검자 이름" /></div>
              <div className="flex gap-3"><button onClick={() => setIsModalOpen(false)} className="flex-1 py-4 bg-gray-100 font-black rounded-xl">취소</button><button onClick={handleSaveLog} disabled={isSubmitting} className="flex-[2] py-4 bg-blue-600 text-white font-black rounded-xl">{isSubmitting ? '저장 중...' : '저장하기'}</button></div>
            </div>
          </div>
        </div>
      )}
      {deleteTargetId && <ConfirmModal title="점검일지 삭제" message="정말로 삭제하시겠습니까?" onConfirm={deleteLog} onCancel={() => setDeleteTargetId(null)} />}
    </div>
  );
}


// --- 시설안전관리 신규 등록 및 수정 컴포넌트 ---
function ReportForm({ userProfile, existingData, onSave, onCancel, showToast }) {
  const [formData, setFormData] = useState(existingData || {
    category: CATEGORIES[0], trade: TRADES[0], inspectorName: userProfile.name, inspectorEmail: userProfile.email, inspectorUid: userProfile.uid,
    date: new Date().toISOString().split('T')[0], status: STATUSES[0], isEmergency: false, photoBase64: '', photoDesc: '', location: null, locationDesc: '', remarks: ''
  });
  const [error, setError] = useState(''); 
  const [isSubmitting, setSubmit] = useState(false);
  const set = (f, v) => { setFormData(p => ({...p, [f]: v})); if(error) setError(''); };


  const uploadImage = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image(); img.src = ev.target.result;
      img.onload = () => {
        const cvs = document.createElement('canvas'); const scale = img.width > 800 ? 800/img.width : 1;
        cvs.width = img.width * scale; cvs.height = img.height * scale;
        cvs.getContext('2d').drawImage(img, 0, 0, cvs.width, cvs.height);
        set('photoBase64', cvs.toDataURL('image/jpeg', 0.7));
      };
    }; reader.readAsDataURL(file);
  };


  const submit = async () => {
    if (!formData.photoBase64) { 
      setError('사진을 반드시 첨부해 주세요.'); return; 
    }
    setSubmit(true);
    try {
      const autoTitle = `[${formData.category}] ${formData.locationDesc ? formData.locationDesc + ' 점검' : '점검 내역'}`;
      const data = { ...formData, title: autoTitle, updatedAt: Date.now() };
      delete data.id;


      if (existingData) { 
        await db.collection(reportsPath).doc(existingData.id).update(data); 
      } else { 
        data.createdAt = Date.now(); 
        await db.collection(reportsPath).add(data); 
      }


      showToast('성공적으로 저장되었습니다.'); 
      onSave();
    } catch(err) { 
      setError('저장 중 오류가 발생했습니다.'); 
    } finally { 
      setSubmit(false); 
    }
  };


  return (
    <div className="bg-white rounded-2xl shadow-sm border p-6 md:p-8 w-full max-w-7xl mx-auto">
      <h2 className="text-2xl font-black mb-6 border-b pb-4 flex items-center gap-2"><Icon name={existingData?'edit':'plus'} className="text-blue-600"/> {existingData?'점검 내역 수정':'신규 점검 기록 작성'}</h2>
      {error && <div className="bg-red-50 text-red-700 p-4 rounded-xl mb-6 font-bold flex items-center gap-3"><Icon name="alert-circle"/> {error}</div>}
      
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div className="space-y-6">
          <div className="grid grid-cols-3 gap-4">
            <div><label className="block text-sm font-bold mb-2">대분류</label><select className="w-full p-3 border rounded-xl bg-gray-50 font-bold" value={formData.category} onChange={e => set('category', e.target.value)}>{CATEGORIES.map(c => <option key={c}>{c}</option>)}</select></div>
            <div className="col-span-2"><label className="block text-sm font-bold mb-2">공종 분류</label><select className="w-full p-3 border rounded-xl bg-gray-50 font-bold" value={formData.trade} onChange={e => set('trade', e.target.value)}>{TRADES.map(t => <option key={t}>{t}</option>)}</select></div>
          </div>
          
          <div className="grid grid-cols-2 gap-4">
            <div><label className="block text-sm font-bold mb-2">점검 날짜</label><input type="date" className="w-full p-3 border rounded-xl bg-gray-50 font-bold" value={formData.date} onChange={e => set('date', e.target.value)} /></div>
            <div><label className="block text-sm font-bold mb-2">점검자</label><input disabled className="w-full p-3 border rounded-xl bg-gray-100 font-bold" value={formData.inspectorName} /></div>
          </div>
          <div className="bg-slate-50 p-5 rounded-xl border">
            <label className="block text-sm font-bold mb-3">조치 결과</label>
            <div className="flex flex-wrap gap-4">
              {STATUSES.map(s => (
                <label key={s} className={`flex items-center gap-2 p-3 rounded-lg border cursor-pointer transition-colors ${formData.status===s?'bg-blue-100 border-blue-300':'bg-white hover:bg-gray-50'}`}>
                  <input type="radio" value={s} checked={formData.status===s} onChange={e => set('status', e.target.value)} className="w-5 h-5 text-blue-600" />
                  <span className="font-black">{s}</span>
                </label>
              ))}
            </div>
          </div>
          <label className={`flex items-center gap-3 p-4 border rounded-xl w-full cursor-pointer transition-colors ${formData.isEmergency?'bg-red-100 border-red-300 text-red-800':'bg-red-50 border-red-200 text-red-800 hover:bg-red-100'}`}><input type="checkbox" checked={formData.isEmergency} onChange={e => set('isEmergency', e.target.checked)} className="w-6 h-6 rounded" /><span className="font-black text-base">🚨 긴급 건으로 분류</span></label>
        </div>


        <div className="space-y-6 lg:pl-8 lg:border-l">
          <div>
            <label className="block text-sm font-bold mb-2 flex items-center gap-2"><Icon name="camera" className="text-blue-600"/> 사진 대지 첨부 * <span className="text-red-500 font-normal text-xs ml-2">(사진 첨부 시 즉시 저장 가능)</span></label>
            {formData.photoBase64 ? (
              <div className="relative w-full rounded-xl overflow-hidden border flex justify-center group"><img src={formData.photoBase64} className="max-h-64 object-contain"/><button onClick={() => set('photoBase64','')} className="absolute top-3 right-3 bg-red-500 text-white p-2 rounded-full opacity-0 group-hover:opacity-100"><Icon name="x"/></button></div>
            ) : (
              <label className="flex flex-col items-center justify-center w-full h-48 border-2 border-dashed rounded-xl bg-gray-50 cursor-pointer"><Icon name="camera" size={48} className="mb-3 text-gray-400"/><span className="font-bold text-gray-500">사진 업로드</span><input type="file" className="hidden" accept="image/*" onChange={uploadImage}/></label>
            )}
          </div>
          <div><label className="block text-sm font-bold mb-2">사진 상세 설명</label><textarea className="w-full p-3.5 border rounded-xl bg-gray-50 font-medium h-24 resize-none" value={formData.photoDesc} onChange={e => set('photoDesc', e.target.value)} /></div>
          <div><label className="block text-sm font-bold mb-2 flex items-center gap-2"><Icon name="map-pin" className="text-blue-600"/> 위치 지정 (선택)</label><GoogleImageMap location={formData.location} onChange={loc => set('location', loc)} /></div>
          <div><label className="block text-sm font-bold mb-2">상세 위치 설명</label><input className="w-full p-3.5 border rounded-xl bg-gray-50 font-bold" value={formData.locationDesc} onChange={e => set('locationDesc', e.target.value)} placeholder="예: 야구장 1루측 내야석 출입구 인근" /></div>
          <div><label className="block text-sm font-bold mb-2">비고</label><textarea className="w-full p-3.5 border rounded-xl bg-gray-50 font-medium h-28 resize-none" value={formData.remarks} onChange={e => set('remarks', e.target.value)} /></div>
        </div>
      </div>
      <div className="flex gap-4 mt-8 pt-6 border-t">
        <button onClick={onCancel} className="flex-1 py-4 bg-gray-100 hover:bg-gray-200 font-black rounded-xl transition-colors">취소</button>
        <button onClick={submit} disabled={isSubmitting !== false} className="flex-[2] py-4 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-xl disabled:opacity-50 transition-colors shadow-md active:scale-95 flex justify-center items-center gap-2">
          {isSubmitting ? (
            <><Icon name="clock" size={20} className="animate-spin" /> 저장 처리 중...</>
          ) : '저장 완료하기'}
        </button>
      </div>
    </div>
  );
}


function ReportDetail({ report, userProfile, onEdit, onDelete, showToast }) {
  const [showConfirm, setShowConfirm] = useState(false);
  const doDelete = async () => { try { await db.collection(reportsPath).doc(report.id).delete(); showToast('삭제되었습니다.'); onDelete(); } catch { showToast('삭제 오류'); } };
  return (
    <div className="bg-white rounded-2xl shadow-sm border p-6 md:p-8 w-full max-w-7xl mx-auto relative">
      {showConfirm && <ConfirmModal title="기록 삭제" message="정말로 이 기록을 삭제하시겠습니까?" onConfirm={doDelete} onCancel={() => setShowConfirm(false)} />}
      <div className="flex flex-col md:flex-row justify-between items-start mb-8 border-b pb-6 gap-4">
        <div>
          <div className="flex items-center gap-2 mb-3"><span className="text-sm font-black text-blue-700 bg-blue-50 px-3 py-1 rounded-full">{report.category}</span><span className="text-sm font-bold bg-gray-50 border px-3 py-1 rounded-full">{report.trade}</span>{report.isEmergency && <span className="bg-red-100 text-red-700 px-3 py-1 rounded-full text-xs font-black flex items-center gap-1 animate-pulse"><Icon name="alert-circle" size={14}/> 긴급</span>}</div>
          <h2 className="text-2xl md:text-3xl font-black text-gray-900">{report.title}</h2>
        </div>
        <div className="text-right"><span className={`inline-block px-4 py-2 rounded-full text-sm font-black mb-3 border ${report.status==='조치 완료'?'bg-green-100 text-green-700 border-green-200':report.status==='조치 중'?'bg-yellow-100 text-yellow-700 border-yellow-200':'bg-white text-gray-700 border-gray-300'}`}>{report.status}</span><p className="text-sm font-bold text-gray-500 flex items-center justify-end gap-1"><Icon name="clock" size={14}/> 점검일: {report.date}</p></div>
      </div>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
        <div><h3 className="text-lg font-black mb-3 flex items-center gap-2"><Icon name="camera" className="text-blue-600"/> 현장 사진</h3>{report.photoBase64 ? <img src={report.photoBase64} className="rounded-xl border max-h-80 w-full object-contain bg-gray-100"/> : <div className="rounded-xl border bg-gray-50 h-80 flex items-center justify-center font-bold text-gray-400">사진 없음</div>}<div className="mt-4"><span className="text-xs font-bold text-gray-500 block mb-2">사진 설명</span><p className="text-sm bg-gray-50 p-4 rounded-xl border font-medium whitespace-pre-wrap">{report.photoDesc}</p></div></div>
        <div><h3 className="text-lg font-black mb-3 flex items-center gap-2"><Icon name="map-pin" className="text-blue-600"/> 위치 정보</h3><GoogleImageMap location={report.location} /><div className="mt-4"><span className="text-xs font-bold text-gray-500 block mb-2">상세 위치</span><p className="text-sm font-black p-4 bg-blue-50 border-blue-100 rounded-xl flex items-start gap-2"><Icon name="map-pin" size={18} className="text-blue-600 mt-0.5"/>{report.locationDesc}</p></div></div>
      </div>
      <div className="grid grid-cols-2 gap-4 mb-8 bg-slate-50 p-5 rounded-xl border">
        <div><span className="text-xs font-bold text-gray-500 block mb-1">담당 점검자</span><span className="font-black">{report.inspectorName} <span className="text-xs font-medium text-gray-500">({report.inspectorEmail})</span></span></div>
        <div><span className="text-xs font-bold text-gray-500 block mb-1">등록 일시</span><span className="font-black">{new Date(report.createdAt).toLocaleString()}</span></div>
      </div>
      {report.remarks && <div className="mb-8"><h3 className="text-sm font-black mb-2">비고</h3><p className="bg-white p-4 rounded-xl border font-medium whitespace-pre-wrap">{report.remarks}</p></div>}
      
      {/* 누구나 수정 및 삭제 가능 */}
      <div className="flex gap-3 pt-6 border-t justify-end">
        <button onClick={onEdit} className="px-6 py-3 bg-blue-50 text-blue-700 font-black rounded-xl flex gap-2 hover:bg-blue-100 transition-colors"><Icon name="edit" size={18}/> 수정</button>
        <button onClick={() => setShowConfirm(true)} className="px-6 py-3 bg-red-50 text-red-700 font-black rounded-xl flex gap-2 hover:bg-red-100 transition-colors"><Icon name="trash-2" size={18}/> 삭제</button>
      </div>
    </div>
  );
}


// ── App 시작 부분 ─────────────────────────────────────────────────────────────
function App() {
  const [user, setUser] = useState(null);
  const [userProfile, setUserProfile] = useState(null);
  const [reports, setReports] = useState([]);
  const [dailyLogs, setDailyLogs] = useState([]);
  const [activeTab, setActiveTab] = useState('voc');
  const [view, setView] = useState('loading');
  const [selectedReport, setSelected] = useState(null);
  const [authError, setAuthError] = useState('');
  const [toastMsg, setToastMsg] = useState('');
  
  const [searchTerm, setSearchTerm] = useState('');
  const [statusFilter, setStatusFilter] = useState('');
  const [emergencyFilter, setEmergencyFilter] = useState(false);


  const toast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(''), 5000); };


  // 초기 인증 로직
  useEffect(() => {
    let isResolved = false;
    const fallbackTimer = setTimeout(() => {
      if (!isResolved) {
        setAuthError('Firebase 응답이 없습니다. Vercel 도메인 승인이나 Firestore 규칙 설정을 다시 한 번 확인해 주세요.');
        setView('error');
      }
    }, 5000);


    const checkAuth = async () => {
      try {
        await auth.signInAnonymously();
      } catch (err) {
        isResolved = true;
        clearTimeout(fallbackTimer);
        
        if (err.code === 'auth/unauthorized-domain') {
          setAuthError('Vercel 배포 주소가 Firebase에 등록되지 않았습니다! \n\n[해결방법]\n1. Firebase 콘솔 접속\n2. 좌측 Authentication 클릭\n3. 상단 Settings(설정) 탭 클릭\n4. Authorized domains(승인된 도메인) 메뉴로 이동\n5. Add domain(도메인 추가)을 눌러 현재 Vercel 사이트 주소를 추가하세요.');
        } else {
          setAuthError(`로그인 오류가 발생했습니다: ${err.message}`);
        }
        setView('error');
      }
    };
    checkAuth();


    const unsub = auth.onAuthStateChanged(async (u) => {
      if (u) {
        isResolved = true;
        clearTimeout(fallbackTimer);
        setUser(u);
        try {
          const snap = await db.collection('users').doc(u.uid).get();
          if (snap.exists) {
            setUserProfile(snap.data());
            setView('dashboard');
          } else {
            setView('register');
          }
        } catch (err) {
          setAuthError(`데이터베이스 접속 권한 오류입니다. \n\nFirebase Console -> Firestore Database -> 규칙(Rules) 탭에서 아래와 같이 설정해주세요.\n\nmatch /{document=**} {\n  allow read, write: if true;\n}\n\n(상세 에러: ${err.message})`);
          setView('error');
        }
      }
    });


    return () => { unsub(); clearTimeout(fallbackTimer); };
  }, []);


  useEffect(() => {
    if (!user || !userProfile) return;
    
    const unsubReports = db.collection(reportsPath).onSnapshot(snap => {
      const data = snap.docs.map(d => ({id: d.id, ...d.data()}));
      data.sort((a, b) => b.createdAt - a.createdAt);
      setReports(data);
    }, err => console.error("Reports DB Error:", err));


    const unsubLogs = db.collection(logsPath).onSnapshot(snap => {
      setDailyLogs(snap.docs.map(d => ({id: d.id, ...d.data()})));
    }, err => console.error("Logs DB Error:", err));


    return () => { unsubReports(); unsubLogs(); };
  }, [user, userProfile]);


  // 에러 화면
  if (view === 'error') return (
    <div className="min-h-screen flex items-center justify-center bg-gray-50 p-4">
      <div className="bg-white rounded-3xl shadow-2xl p-8 max-w-lg w-full text-center border-t-8 border-red-500">
        <div className="bg-red-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6"><Icon name="alert-circle" size={40} className="text-red-500"/></div>
        <h2 className="text-2xl font-black text-gray-900 mb-4">접속 오류 발생</h2>
        <p className="text-sm text-gray-700 mb-8 font-bold leading-relaxed bg-gray-50 p-4 rounded-xl text-left whitespace-pre-wrap">{authError}</p>
        <button onClick={() => window.location.reload()} className="w-full bg-slate-800 hover:bg-slate-900 text-white font-black py-4 rounded-xl shadow-md">새로고침 재시도</button>
      </div>
    </div>
  );


  // 로딩 화면
  if (view === 'loading') return (
    <div className="min-h-screen flex flex-col items-center justify-center bg-gray-50 text-gray-500">
      <div className="animate-spin rounded-full h-16 w-16 border-t-4 border-blue-500 border-solid mb-4"></div>
      <span className="font-black text-lg mt-4">시스템 접속 중입니다...</span>
    </div>
  );


  // 등록 화면
  if (view === 'register') return <RegisterForm user={user} setProfile={setUserProfile} setView={setView} showToast={toast} />;


  // 필터링 적용
  const filtered = reports.filter(r => {
    const matchSearch = (r.title || '').includes(searchTerm) || (r.locationDesc || '').includes(searchTerm);
    const matchStatus = statusFilter ? r.status === statusFilter : true;
    const matchEmergency = emergencyFilter ? r.isEmergency : true;
    return matchSearch && matchStatus && matchEmergency;
  });


  return (
    <div className="min-h-screen bg-gray-50 flex flex-col font-sans pb-10">
      <header className="bg-slate-800 text-white shadow-md sticky top-0 z-10">
        <div className="w-full px-4 md:px-8 h-16 flex items-center justify-between max-w-[1800px] mx-auto">
          <div className="flex items-center gap-2 cursor-pointer hover:opacity-80" onClick={() => { setView('dashboard'); setActiveTab('voc'); }}>
            <Icon name="file-warning" size={24} className="text-yellow-400"/>
            <span className="font-bold text-lg hidden sm:block">업무용 시설/안전 점검 시스템</span>
            <span className="font-bold text-lg sm:hidden">점검 시스템</span>
          </div>
          <div className="flex items-center gap-2 text-sm bg-slate-700 px-3 py-1.5 rounded-full shadow-inner">
            <Icon name="user" size={16}/> <span className="font-bold">{userProfile?.name} 님</span>
          </div>
        </div>
      </header>


      <main className="flex-1 w-full max-w-full p-3 md:p-6 flex flex-col gap-6">
        {view !== 'dashboard' && (
          <button onClick={() => { setView('dashboard'); setSelected(null); }} className="flex items-center gap-2 text-slate-600 hover:text-slate-900 font-black bg-white px-5 py-3 rounded-xl shadow-sm border border-gray-200 mx-auto max-w-7xl w-full transition-transform hover:scale-[1.01]">
            <Icon name="home" size={20}/> 대시보드로 돌아가기
          </button>
        )}


        {view === 'dashboard' && (
          <div className="w-full max-w-[1800px] mx-auto flex flex-col gap-6">
            <div className="flex flex-wrap bg-white p-1.5 rounded-2xl shadow-sm border border-gray-200 w-fit">
              <button onClick={() => setActiveTab('voc')} className={`px-6 py-3 rounded-xl text-sm font-black flex items-center gap-2 transition-all ${activeTab==='voc'?'bg-slate-800 text-white shadow-md':'text-gray-500 hover:bg-gray-100'}`}>
                <Icon name="file-warning" size={18}/> 시설안전관리
              </button>
              <button onClick={() => setActiveTab('calendar')} className={`px-6 py-3 rounded-xl text-sm font-black flex items-center gap-2 transition-all ${activeTab==='calendar'?'bg-slate-800 text-white shadow-md':'text-gray-500 hover:bg-gray-100'}`}>
                <Icon name="calendar" size={18}/> 일일 점검일지
              </button>
              <button onClick={() => setActiveTab('excel')} className={`px-6 py-3 rounded-xl text-sm font-black flex items-center gap-2 transition-all ${activeTab==='excel'?'bg-green-600 text-white shadow-md':'text-gray-500 hover:bg-gray-100'}`}>
                <Icon name="download" size={18}/> 엑셀로 내보내기
              </button>
            </div>


            {activeTab === 'voc' && (
              <div className="w-full max-w-7xl mx-auto animate-in fade-in duration-300">
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                  <StatusCard title="조치 예정" count={reports.filter(r=>r.status==='조치 예정').length} color="bg-red-50 text-red-700 border-red-200" iconName="alert-circle"/>
                  <StatusCard title="조치 중" count={reports.filter(r=>r.status==='조치 중').length} color="bg-yellow-50 text-yellow-700 border-yellow-200" iconName="clock"/>
                  <StatusCard title="조치 완료" count={reports.filter(r=>r.status==='조치 완료').length} color="bg-green-50 text-green-700 border-green-200" iconName="check-circle"/>
                  <StatusCard title="긴급 건" count={reports.filter(r=>r.isEmergency).length} color="bg-purple-50 text-purple-700 border-purple-200" iconName="file-warning"/>
                </div>


                <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 flex flex-col md:flex-row gap-4 items-center justify-between mb-6">
                  <div className="flex flex-wrap gap-2 w-full md:w-auto">
                    <select className="p-3 border border-gray-300 rounded-xl bg-gray-50 outline-none text-sm font-bold" value={statusFilter} onChange={e => setStatusFilter(e.target.value)}>
                      <option value="">모든 진행상태</option>
                      {STATUSES.map(s => <option key={s}>{s}</option>)}
                    </select>
                    <button onClick={() => setEmergencyFilter(!emergencyFilter)} className={`px-4 py-3 border rounded-xl text-sm flex items-center gap-2 font-black transition-all ${emergencyFilter?'bg-purple-600 text-white border-purple-600 shadow-md':'bg-white text-gray-700 border-gray-300 hover:bg-gray-50'}`}>
                      <Icon name="alert-circle" size={18}/> {emergencyFilter ? '긴급 건만 보는 중' : '긴급 건만 보기'}
                    </button>
                  </div>
                  <div className="flex gap-2 w-full md:w-auto">
                    <div className="relative flex-1 md:w-80">
                      <Icon name="search" size={18} className="absolute left-4 top-3.5 text-gray-400 pointer-events-none"/>
                      <input type="text" placeholder="제목/위치 검색..." className="w-full pl-12 pr-4 py-3 border border-gray-300 rounded-xl bg-gray-50 outline-none text-sm font-bold" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                    </div>
                    <button onClick={() => { setSelected(null); setView('form'); }} className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl flex items-center gap-2 font-black shrink-0 shadow-md transition-transform hover:scale-[1.02] active:scale-95">
                      <Icon name="plus" size={18}/> 신규 등록
                    </button>
                  </div>
                </div>


                <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm whitespace-nowrap">
                      <thead className="bg-gray-100 border-b border-gray-200 text-gray-700">
                        <tr>
                          <th className="p-5 font-black w-16 text-center">긴급</th>
                          <th className="p-5 font-black">대분류</th>
                          <th className="p-5 font-black">공종</th>
                          <th className="p-5 font-black w-full">제목</th>
                          <th className="p-5 font-black">점검자</th>
                          <th className="p-5 font-black">점검일자</th>
                          <th className="p-5 font-black">상태</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-100">
                        {filtered.length === 0 ? (
                          <tr><td colSpan="7" className="p-16 text-center text-gray-500 font-bold">등록된 점검 내역이 없습니다.</td></tr>
                        ) : filtered.map(r => (
                          <tr key={r.id} onClick={() => { setSelected(r); setView('detail'); }} className="hover:bg-blue-50 cursor-pointer transition-colors group">
                            <td className="p-5 text-center">{r.isEmergency && <span className="bg-red-100 text-red-700 px-3 py-1.5 rounded-full text-xs font-black shadow-sm">긴급</span>}</td>
                            <td className="p-5 text-gray-600 font-bold">{r.category}</td>
                            <td className="p-5 text-gray-800 font-black">{r.trade}</td>
                            <td className="p-5 font-black text-gray-900 max-w-[200px] md:max-w-md overflow-hidden text-ellipsis group-hover:text-blue-700">{r.title}</td>
                            <td className="p-5 text-gray-600 font-bold">{r.inspectorName}</td>
                            <td className="p-5 text-gray-600 font-bold">{r.date}</td>
                            <td className="p-5">
                              <span className={`px-4 py-1.5 rounded-full text-xs font-black border shadow-sm ${r.status==='조치 완료'?'bg-green-100 text-green-700 border-green-200':r.status==='조치 중'?'bg-yellow-100 text-yellow-700 border-yellow-200':'bg-white text-gray-700 border-gray-300'}`}>{r.status}</span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}


            {activeTab === 'calendar' && <CalendarView logs={dailyLogs} userProfile={userProfile} showToast={toast} />}
            
            {activeTab === 'excel' && <ExcelExportView reports={reports} />}
          </div>
        )}


        {view === 'form' && (
          <div className="w-full max-w-7xl mx-auto animate-in fade-in slide-in-from-bottom-4 duration-300">
            <ReportForm userProfile={userProfile} existingData={selectedReport} onSave={() => setView('dashboard')} onCancel={() => setView(selectedReport ? 'detail' : 'dashboard')} showToast={toast} />
          </div>
        )}
        {view === 'detail' && selectedReport && (
          <div className="w-full max-w-7xl mx-auto animate-in fade-in zoom-in-95 duration-200">
            <ReportDetail report={selectedReport} userProfile={userProfile} onEdit={() => setView('form')} onDelete={() => setView('dashboard')} showToast={toast} />
          </div>
        )}
      </main>


      {toastMsg && (
        <div className="fixed bottom-6 right-6 bg-slate-900 text-white px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3 z-50 animate-bounce border border-slate-700">
          <Icon name="mail" size={20} className="text-blue-400"/>
          <span className="font-bold">{toastMsg}</span>
        </div>
      )}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
